# GitHub Pages site for andreyolv.github.io
# Built with Zensical (https://github.com/zensical/zensical), a MkDocs-compatible
# static site generator by the creators of Material for MkDocs.
# Build locally with: pip install -r requirements.txt && zensical serve
# Navigation is generated from the docs/ folder tree on purpose, so new
# portfolio pages show up without editing this file.

site_name: Andrey Oliveira
site_description: Platform & Data Engineering — CV, projects and technical portfolio.
site_author: Andrey Oliveira
site_url: https://andreyolv.github.io/

edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Tech Stack: tech-stack.md
  - CV: cv.md
  - Portfolio:
      - Overview: portfolio/README.md
      - Categories: portfolio/categories.md
      - Projects by Status: portfolio/catalog.md
  - Articles: articles/README.md

theme:
  name: material
  language: en
  logo: assets/avatar.jpg
  favicon: assets/avatar.jpg
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: deep purple
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: deep purple
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.indexes
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.suggest
  - content.code.copy

extra_css:
- assets/extra.css
- assets/portfolio.css

extra_javascript:
- assets/portfolio-filter.js

plugins:
- search

markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: info
    unrecognized_links: info

extra:
  generator: false
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/andreyolv
    name: GitHub — andreyolv
